# Navigation (order = order in the menu)
nav:
  - { title: Projects, url: /projects/ }
  - { title: Blog,     url: /blog/ }
  - { title: About,    url: /about/ }
  - { title: Résumé,   url: /resume/ }

# ─────────────────────────────────────────────────────────────
#  Content
# ─────────────────────────────────────────────────────────────
permalink: /blog/:title          # keeps your existing post URLs working

collections:
  projects:
    output: true
    permalink: /projects/:name   # keeps your existing project URLs working

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed      # RSS feed at /feed.xml
  - jekyll-seo-tag   # link previews on LinkedIn etc.

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
