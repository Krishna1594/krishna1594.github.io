<footer class="footer">
  <div class="wrap footer__inner">
    <div>
      <p class="footer__name">{{ site.author.name }}</p>
      <p class="dim">{{ site.tagline }} · {{ site.author.location }}</p>
    </div>
    {% include social.html %}
  </div>
  <div class="wrap footer__meta dim">
    <span>© {{ site.time | date: '%Y' }}</span>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </div>
</footer>
